--contato.html

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Pokedex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html"><span class="pokebola"></span>Pokedex</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="equipe.html"><img class="bone" src="" alt="">Equipe</a>
      <a class="ativo" href="contato.html"><img class="nav-pidgey" src="" alt="">Contato</a>
    </nav>
  </header>

  <main>
    <h1>Fale com a gente</h1>
    <div class="contato-layout">
      <img class="pidgey" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/16.png" alt="Pidgey">
      <form class="formulario" action="#" method="post">
      <label for="nome">Email</label>
      <input type="email" id="nome" name="nome" required>

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui" required></textarea>

      <button type="submit">Enviar mensagem</button>
    </form>
    </div>
  </main>

  <footer>© Pokedex - 2026</footer>
</body>
</html>
